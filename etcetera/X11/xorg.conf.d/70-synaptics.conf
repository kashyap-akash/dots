Section "InputClass"
    Identifier "touchpad"
    Driver "synaptics"
    MatchIsTouchpad "on"

    # Tap to click
    Option "TapButton1" "1"
    Option "TapButton2" "3"
    Option "TapButton3" "2"

    # Enable two-finger scrolling
    Option "VertTwoFingerScroll" "on"
    Option "HorizTwoFingerScroll" "on"

    # Natural scrolling (reverse direction)
    Option "VertScrollDelta" "-111"
    Option "HorizScrollDelta" "-111"

    # Optional: smoother inertia
    Option "CoastingSpeed" "0.1"
EndSection
